<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CityU 兄弟 Gathering 投票</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Microsoft JhengHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1rem;
    }
    .btn-tap {
      transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
    }
    .btn-tap:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body class="min-h-screen pb-24">

  <!-- Top Header -->
  <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur border-b border-slate-800">
    <div class="max-w-lg mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="text-lg font-bold tracking-tight flex items-center gap-2">
          <span>🍻 CityU Gathering</span>
          <span id="dbStatusDot" class="inline-block w-2.5 h-2.5 rounded-full bg-amber-400" title="Local Demo Mode"></span>
        </h1>
      </div>
      <button onclick="openSettings()" class="btn-tap px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm border border-slate-700">
        ⚙️ 設定
      </button>
    </div>

    <!-- Main Tabs -->
    <div class="max-w-lg mx-auto px-4 pb-3 grid grid-cols-2 gap-2">
      <button id="tabBtnVote" onclick="switchTab('vote')" class="btn-tap py-2.5 rounded-xl font-bold text-sm bg-orange-500 text-white shadow-lg shadow-orange-500/20">
        🗳️ 投票
      </button>
      <button id="tabBtnStats" onclick="switchTab('stats')" class="btn-tap py-2.5 rounded-xl font-bold text-sm bg-slate-800 text-slate-300 border border-slate-700">
        📊 戰況 (<span id="voteCountBadge">0</span>)
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-lg mx-auto px-4 pt-4 space-y-4">

    <!-- Demo Banner (Hidden when Firebase connected) -->
    <div id="demoBanner" class="px-3.5 py-2.5 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-between text-xs text-amber-300">
      <span>⚡ 單機預覽模式（撳右上 ⚙️ 貼 Firebase URL 即時同步）</span>
      <button onclick="clearAllVotes()" class="underline font-semibold ml-2 shrink-0">清空範例</button>
    </div>

    <!-- ================= TAB 1: VOTE ================= -->
    <section id="viewVote" class="space-y-4">

      <!-- 0. Name & Headcount -->
      <div class="card p-4 space-y-4">
        <div>
          <label class="block text-sm font-bold text-slate-200 mb-2">👤 你個名</label>
          <input id="inputName" type="text" placeholder="例如：Louis / 阿明"
            class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-orange-500" />
        </div>

        <!-- Adults & Kids Counter -->
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-3 flex flex-col items-center">
            <span class="text-xs text-slate-400 mb-1.5">🧑 大人（包自己）</span>
            <div class="flex items-center gap-3">
              <button type="button" onclick="adjustCount('adults', -1)" class="btn-tap w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 text-lg font-bold">-</button>
              <span id="adultsVal" class="text-xl font-extrabold w-6 text-center text-orange-400">1</span>
              <button type="button" onclick="adjustCount('adults', 1)" class="btn-tap w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 text-lg font-bold">+</button>
            </div>
          </div>

          <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-3 flex flex-col items-center">
            <span class="text-xs text-slate-400 mb-1.5">🧒 小朋友</span>
            <div class="flex items-center gap-3">
              <button type="button" onclick="adjustCount('kids', -1)" class="btn-tap w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 text-lg font-bold">-</button>
              <span id="kidsVal" class="text-xl font-extrabold w-6 text-center text-sky-400">0</span>
              <button type="button" onclick="adjustCount('kids', 1)" class="btn-tap w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 text-lg font-bold">+</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 1. Food Choice -->
      <div class="card p-4 space-y-3">
        <div class="text-sm font-bold text-slate-200">1️⃣ 食乜好？</div>
        <div id="foodGrid" class="grid grid-cols-2 gap-2.5"></div>
      </div>

      <!-- 2. Venue Choice -->
      <div class="card p-4 space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-sm font-bold text-slate-200">2️⃣ 揀場地（可多選）</span>
        </div>

        <!-- Car Park Notice -->
        <div class="px-3 py-2 rounded-xl bg-amber-500/15 border border-amber-500/30 text-amber-300 text-xs font-semibold flex items-center gap-2">
          <span>🅿️</span>
          <span>Louis 會所時租 Car Park 約 $29 / hour</span>
        </div>

        <div id="venueList" class="space-y-2"></div>

        <!-- Others Specify Input -->
        <div id="otherVenueBox" class="hidden pt-1">
          <input id="inputOtherVenue" type="text" placeholder="請註明建議場地（例如：大美督 BBQ / 邊間 Party Room）"
            class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-orange-500/60 text-white text-sm placeholder-slate-500 focus:outline-none focus:border-orange-400" />
        </div>
      </div>

      <!-- 3. Dates Choice -->
      <div class="card p-4 space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-sm font-bold text-slate-200">3️⃣ 邊日得閒？</span>
          <span class="text-xs text-slate-400">撳1下 ✅得閒 · 撳2下 ⭐首選</span>
        </div>

        <div class="grid grid-cols-3 gap-2 text-center text-xs font-bold text-slate-400 pb-1">
          <div>星期五</div>
          <div>星期六</div>
          <div>星期日</div>
        </div>
        <div id="dateGrid" class="grid grid-cols-3 gap-2"></div>
      </div>

      <!-- Optional Note -->
      <div class="card p-4">
        <input id="inputNote" type="text" placeholder="💬 備註（選填：如唔食牛 / 揸車 / 8點先到）"
          class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm placeholder-slate-500 focus:outline-none focus:border-orange-500" />
      </div>

      <!-- Submit Button -->
      <button onclick="submitVote()" class="btn-tap w-full py-4 rounded-2xl bg-gradient-to-r from-orange-500 to-rose-500 text-white font-extrabold text-base shadow-xl shadow-orange-500/25">
        🚀 送出 / 更新投票
      </button>

    </section>

    <!-- ================= TAB 2: STATS ================= -->
    <section id="viewStats" class="hidden space-y-4">

      <!-- Best Combo Highlight -->
      <div id="bestComboCard" class="card p-4 bg-gradient-to-br from-slate-800 to-slate-900 border-orange-500/40 space-y-2"></div>

      <!-- Share Action Buttons -->
      <div class="grid grid-cols-2 gap-2.5">
        <button onclick="copyShareLink()" class="btn-tap py-2.5 px-3 rounded-xl bg-slate-800 border border-slate-700 text-xs font-bold text-slate-200">
          🔗 複製投票 Link
        </button>
        <button onclick="copyWhatsAppSummary()" class="btn-tap py-2.5 px-3 rounded-xl bg-emerald-600/20 border border-emerald-500/40 text-xs font-bold text-emerald-300">
          📲 複製戰況出 Group
        </button>
      </div>

      <!-- Top Dates Leaderboard -->
      <div class="card p-4 space-y-3">
        <div class="text-sm font-bold text-slate-200">📅 日子人數排行（撳日子睇名單）</div>
        <div id="statsDates" class="space-y-2"></div>
      </div>

      <!-- Venue Leaderboard -->
      <div class="card p-4 space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-sm font-bold text-slate-200">📍 場地票數</span>
          <span class="text-[11px] text-amber-300">🅿️ 會所時租 ~$29/hr</span>
        </div>
        <div id="statsVenues" class="space-y-2.5"></div>
      </div>

      <!-- Food Leaderboard -->
      <div class="card p-4 space-y-3">
        <div class="text-sm font-bold text-slate-200">🍖 食乜票數</div>
        <div id="statsFoods" class="space-y-2"></div>
      </div>

      <!-- All Voters List -->
      <div class="card p-4 space-y-3">
        <div class="text-sm font-bold text-slate-200">👥 已投票兄弟名單</div>
        <div id="statsVoters" class="space-y-2"></div>
      </div>

    </section>
  </main>

  <!-- ================= SETTINGS MODAL ================= -->
  <div id="settingsModal" class="fixed inset-0 z-50 hidden bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="card w-full max-w-md p-5 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-bold">⚙️ Host 管理設定</h2>
        <button onclick="closeSettings()" class="text-slate-400 hover:text-white text-xl leading-none">&times;</button>
      </div>

      <!-- Firebase DB Input -->
      <div class="space-y-1.5">
        <label class="block text-xs font-bold text-slate-300">🔥 Firebase Realtime Database URL</label>
        <input id="inputFirebaseUrl" type="url" placeholder="https://your-project-default-rtdb.asia-southeast1.firebasedatabase.app"
          class="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-orange-500" />
        <p class="text-[11px] text-slate-400">貼上後撳儲存，再用「複製投票 Link」send 落 Group 就會全自動連線。</p>
      </div>

      <!-- Custom Venues Manager -->
      <div class="space-y-2 pt-2 border-t border-slate-800">
        <label class="block text-xs font-bold text-slate-300">📍 管理場地選項（Others 會自動固定喺最底）</label>
        <div id="settingsVenueList" class="space-y-1.5"></div>
        <div class="flex gap-2 pt-1">
          <input id="inputNewVenue" type="text" placeholder="新增場地名稱..."
            class="flex-1 px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white" />
          <button onclick="addVenueOption()" class="btn-tap px-3 py-2 rounded-xl bg-slate-700 text-xs font-bold">+ 新增</button>
        </div>
      </div>

      <!-- Danger Zone -->
      <div class="pt-2 border-t border-slate-800 flex items-center justify-between">
        <button onclick="clearAllVotes()" class="text-xs text-rose-400 underline">🗑️ 清空所有投票數據</button>
        <div class="flex gap-2">
          <button onclick="closeSettings()" class="px-3.5 py-2 rounded-xl bg-slate-800 text-xs font-bold">取消</button>
          <button onclick="saveSettings()" class="btn-tap px-4 py-2 rounded-xl bg-orange-500 text-white text-xs font-bold">儲存設定</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2.5 rounded-full bg-slate-800 border border-slate-600 text-xs font-bold text-white shadow-2xl"></div>

  <script>
    // =========================================================
    // 1. 可直接喺度填寫你條 Firebase URL（或者喺網頁右上角 ⚙️ 貼入）
    // =========================================================
    const DEFAULT_FIREBASE_URL = "https://console.firebase.google.com/project/cityu-gathering/database/cityu-gathering-default-rtdb/data/~2F";

    const STORAGE_PREFIX = "cityu_gathering_v5";

    const FOOD_OPTIONS = [
      { id: "bbq", label: "🔥 燒嘢食" },
      { id: "hotpot", label: "🍲 打邊爐" },
      { id: "both", label: "⚡ Both 雙拼" },
      { id: "any", label: "🍺 無所謂" }
    ];

    const DEFAULT_VENUES = [
      "Louis 會所 2/F",
      "Louis 會所 28/F"
    ];

    const OTHER_VENUE_KEY = "Others";

    // 2026年 11月27日 至 12月20日（連續4個五、六、日）
    const DATE_OPTIONS = [
      { id: "2026-11-27", label: "11/27", dow: "五" },
      { id: "2026-11-28", label: "11/28", dow: "六" },
      { id: "2026-11-29", label: "11/29", dow: "日" },
      { id: "2026-12-04", label: "12/4",  dow: "五" },
      { id: "2026-12-05", label: "12/5",  dow: "六" },
      { id: "2026-12-06", label: "12/6",  dow: "日" },
      { id: "2026-12-11", label: "12/11", dow: "五" },
      { id: "2026-12-12", label: "12/12", dow: "六" },
      { id: "2026-12-13", label: "12/13", dow: "日" },
      { id: "2026-12-18", label: "12/18", dow: "五" },
      { id: "2026-12-19", label: "12/19", dow: "六" },
      { id: "2026-12-20", label: "12/20", dow: "日" }
    ];

    const DEMO_VOTES = {
      "louis": {
        name: "Louis",
        adults: 2,
        kids: 0,
        food: "both",
        venues: ["Louis 會所 2/F", "Louis 會所 28/F"],
        otherVenue: "",
        dates: { "2026-11-28": 2, "2026-12-05": 2, "2026-12-12": 1 },
        note: "主場隨時 Ready",
        updatedAt: Date.now() - 3600000
      },
      "阿明": {
        name: "阿明",
        adults: 2,
        kids: 1,
        food: "bbq",
        venues: ["Louis 會所 28/F", "Others"],
        otherVenue: "大美督 BBQ",
        dates: { "2026-11-28": 1, "2026-12-05": 2 },
        note: "揸車嚟",
        updatedAt: Date.now() - 1800000
      }
    };

    // App State
    let firebaseUrl = "";
    let venues = [...DEFAULT_VENUES];
    let votes = {};
    let sseSource = null;
    let pollTimer = null;
    let expandedDateId = null;

    // Current User Form State
    let form = {
      name: "",
      adults: 1,
      kids: 0,
      food: "both",
      venues: ["Louis 會所 2/F"],
      otherVenue: "",
      dates: {}, // { '2026-11-28': 1 (available) | 2 (preferred) }
      note: ""
    };

    // =========================================================
    // Initialization
    // =========================================================
    function init() {
      const params = new URLSearchParams(window.location.search);
      const urlDb = params.get("db");
      const savedDb = localStorage.getItem(`${STORAGE_PREFIX}_db`);
      firebaseUrl = cleanFirebaseUrl(urlDb || DEFAULT_FIREBASE_URL || savedDb || "");

      if (urlDb) {
        localStorage.setItem(`${STORAGE_PREFIX}_db`, firebaseUrl);
      }

      // Load saved venues (local fallback)
      const savedVenues = localStorage.getItem(`${STORAGE_PREFIX}_venues`);
      if (savedVenues) {
        try {
          const parsed = JSON.parse(savedVenues);
          if (Array.isArray(parsed) && parsed.length > 0) venues = parsed;
        } catch (e) {}
      }

      // Load user's previous draft/submission
      const savedMe = localStorage.getItem(`${STORAGE_PREFIX}_myform`);
      if (savedMe) {
        try {
          const parsed = JSON.parse(savedMe);
          form = { ...form, ...parsed };
        } catch (e) {}
      }

      hydrateFormInputs();
      renderFoodOptions();
      renderVenueOptions();
      renderDateOptions();

      if (firebaseUrl) {
        connectFirebase();
      } else {
        loadLocalVotes();
      }
    }

    function cleanFirebaseUrl(url) {
      if (!url) return "";
      let u = url.trim().replace(/\/+$/, "");
      if (u.endsWith(".json")) {
        u = u.substring(0, u.lastIndexOf("/"));
      }
      return u;
    }

    // =========================================================
    // Data Layer (Firebase Realtime DB + Local Fallback)
    // =========================================================
    function loadLocalVotes() {
      updateDbIndicator(false);
      const raw = localStorage.getItem(`${STORAGE_PREFIX}_votes`);
      if (raw) {
        try {
          votes = JSON.parse(raw) || {};
        } catch (e) {
          votes = { ...DEMO_VOTES };
        }
      } else {
        votes = { ...DEMO_VOTES };
        localStorage.setItem(`${STORAGE_PREFIX}_votes`, JSON.stringify(votes));
      }
      updateAllStats();
    }

    async function connectFirebase() {
      updateDbIndicator(true);
      if (sseSource) { sseSource.close(); sseSource = null; }
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }

      await fetchFirebaseSnapshot();

      // Real-time Server-Sent Events stream
      try {
        sseSource = new EventSource(`${firebaseUrl}/gathering.json`);
        sseSource.addEventListener("put", () => fetchFirebaseSnapshot());
        sseSource.addEventListener("patch", () => fetchFirebaseSnapshot());
        sseSource.onerror = () => {
          if (!pollTimer) {
            pollTimer = setInterval(fetchFirebaseSnapshot, 6000);
          }
        };
      } catch (e) {
        pollTimer = setInterval(fetchFirebaseSnapshot, 6000);
      }
    }

    async function fetchFirebaseSnapshot() {
      if (!firebaseUrl) return;
      try {
        const res = await fetch(`${firebaseUrl}/gathering.json`);
        if (!res.ok) throw new Error("Fetch failed");
        const data = await res.json();
        votes = (data && data.votes) ? data.votes : {};
        if (data && Array.isArray(data.venues) && data.venues.length > 0) {
          venues = data.venues;
          renderVenueOptions();
        }
        updateAllStats();
      } catch (err) {
        console.warn("Firebase sync error:", err);
      }
    }

    function updateDbIndicator(isCloud) {
      const dot = document.getElementById("dbStatusDot");
      const banner = document.getElementById("demoBanner");
      if (isCloud) {
        dot.className = "inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 shadow shadow-emerald-400/50";
        dot.title = "已連線 Firebase 即時同步";
        banner.classList.add("hidden");
      } else {
        dot.className = "inline-block w-2.5 h-2.5 rounded-full bg-amber-400";
        dot.title = "單機預覽模式";
        banner.classList.remove("hidden");
      }
    }

    function normalizeKey(name) {
      return name.trim().toLowerCase().replace(/[.#$\[\]\/]/g, "_");
    }

    // =========================================================
    // Form UI Rendering & Interactions
    // =========================================================
    function hydrateFormInputs() {
      document.getElementById("inputName").value = form.name || "";
      document.getElementById("adultsVal").textContent = form.adults;
      document.getElementById("kidsVal").textContent = form.kids;
      document.getElementById("inputOtherVenue").value = form.otherVenue || "";
      document.getElementById("inputNote").value = form.note || "";
    }

    function adjustCount(type, delta) {
      if (type === "adults") {
        form.adults = Math.max(1, Math.min(15, form.adults + delta));
        document.getElementById("adultsVal").textContent = form.adults;
      } else {
        form.kids = Math.max(0, Math.min(10, form.kids + delta));
        document.getElementById("kidsVal").textContent = form.kids;
      }
    }

    function renderFoodOptions() {
      const container = document.getElementById("foodGrid");
      container.innerHTML = FOOD_OPTIONS.map(opt => {
        const active = form.food === opt.id;
        const cls = active
          ? "bg-orange-500/20 border-orange-500 text-orange-300 font-bold"
          : "bg-slate-900 border-slate-700 text-slate-300";
        return `
          <button type="button" onclick="selectFood('${opt.id}')"
            class="btn-tap py-3 px-3 rounded-xl border text-sm text-center ${cls}">
            ${opt.label}
          </button>
        `;
      }).join("");
    }

    function selectFood(id) {
      form.food = id;
      renderFoodOptions();
    }

    function renderVenueOptions() {
      const allVenues = [...venues, OTHER_VENUE_KEY];
      const container = document.getElementById("venueList");
      container.innerHTML = allVenues.map(v => {
        const active = form.venues.includes(v);
        const cls = active
          ? "bg-orange-500/20 border-orange-500 text-white font-bold"
          : "bg-slate-900 border-slate-700 text-slate-300";
        const check = active ? "✅" : "⬜";
        const displayLabel = v === OTHER_VENUE_KEY ? "Others（其他建議場地）" : v;
        return `
          <button type="button" onclick="toggleVenue('${v.replace(/'/g, "\\'")}')"
            class="btn-tap w-full py-3 px-3.5 rounded-xl border text-sm flex items-center justify-between ${cls}">
            <span>${displayLabel}</span>
            <span>${check}</span>
          </button>
        `;
      }).join("");

      const otherBox = document.getElementById("otherVenueBox");
      if (form.venues.includes(OTHER_VENUE_KEY)) {
        otherBox.classList.remove("hidden");
      } else {
        otherBox.classList.add("hidden");
      }
    }

    function toggleVenue(v) {
      if (form.venues.includes(v)) {
        form.venues = form.venues.filter(item => item !== v);
      } else {
        form.venues.push(v);
      }
      renderVenueOptions();
    }

    function renderDateOptions() {
      const container = document.getElementById("dateGrid");
      container.innerHTML = DATE_OPTIONS.map(d => {
        const state = form.dates[d.id] || 0;
        let cls = "bg-slate-900 border-slate-700 text-slate-400";
        let badge = "";
        if (state === 1) {
          cls = "bg-emerald-500/20 border-emerald-500 text-emerald-200 font-bold";
          badge = "✅ 得閒";
        } else if (state === 2) {
          cls = "bg-amber-500/25 border-amber-400 text-amber-200 font-bold";
          badge = "⭐ 首選";
        }
        return `
          <button type="button" onclick="cycleDate('${d.id}')"
            class="btn-tap py-2.5 px-2 rounded-xl border flex flex-col items-center justify-center min-h-[64px] ${cls}">
            <span class="text-sm">${d.label}</span>
            <span class="text-[11px] mt-0.5 h-4">${badge}</span>
          </button>
        `;
      }).join("");
    }

    function cycleDate(id) {
      const cur = form.dates[id] || 0;
      const next = (cur + 1) % 3;
      if (next === 0) {
        delete form.dates[id];
      } else {
        form.dates[id] = next;
      }
      renderDateOptions();
    }

    // =========================================================
    // Submit Vote
    // =========================================================
    async function submitVote() {
      const name = document.getElementById("inputName").value.trim();
      const otherText = document.getElementById("inputOtherVenue").value.trim();
      const note = document.getElementById("inputNote").value.trim();

      if (!name) {
        showToast("⚠️ 請先填寫你個名！");
        document.getElementById("inputName").focus();
        return;
      }
      if (form.venues.length === 0) {
        showToast("⚠️ 請至少揀一個場地！");
        return;
      }
      if (form.venues.includes(OTHER_VENUE_KEY) && !otherText) {
        showToast("⚠️ 揀咗 Others 請註明建議場地！");
        document.getElementById("inputOtherVenue").focus();
        return;
      }
      if (Object.keys(form.dates).length === 0) {
        showToast("⚠️ 請至少揀一日你得閒嘅日子！");
        return;
      }

      form.name = name;
      form.otherVenue = form.venues.includes(OTHER_VENUE_KEY) ? otherText : "";
      form.note = note;

      localStorage.setItem(`${STORAGE_PREFIX}_myform`, JSON.stringify(form));

      const voterKey = normalizeKey(name);
      const payload = {
        name: form.name,
        adults: form.adults,
        kids: form.kids,
        food: form.food,
        venues: form.venues,
        otherVenue: form.otherVenue,
        dates: form.dates,
        note: form.note,
        updatedAt: Date.now()
      };

      if (firebaseUrl) {
        try {
          await fetch(`${firebaseUrl}/gathering/votes/${encodeURIComponent(voterKey)}.json`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          await fetchFirebaseSnapshot();
          showToast("🎉 投票已即時同步！");
        } catch (err) {
          showToast("❌ 連線失敗，請檢查 Firebase URL");
          return;
        }
      } else {
        votes[voterKey] = payload;
        localStorage.setItem(`${STORAGE_PREFIX}_votes`, JSON.stringify(votes));
        updateAllStats();
        showToast("✅ 已儲存投票！");
      }

      switchTab("stats");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // =========================================================
    // Stats & Leaderboard Calculation
    // =========================================================
    function updateAllStats() {
      const voterList = Object.entries(votes).map(([key, v]) => ({ key, ...v }));
      document.getElementById("voteCountBadge").textContent = voterList.length;

      const totalAdults = voterList.reduce((s, v) => s + (Number(v.adults) || 1), 0);
      const totalKids = voterList.reduce((s, v) => s + (Number(v.kids) || 0), 0);

      // 1. Calculate Dates
      const dateStats = DATE_OPTIONS.map(d => {
        let count = 0;
        let stars = 0;
        let adults = 0;
        let kids = 0;
        const people = [];

        voterList.forEach(v => {
          const st = v.dates && v.dates[d.id];
          if (st) {
            count++;
            if (st === 2) stars++;
            const a = Number(v.adults) || 1;
            const k = Number(v.kids) || 0;
            adults += a;
            kids += k;
            people.push({ name: v.name, state: st, adults: a, kids: k });
          }
        });

        // Score favors more voters first, then preferred stars
        const score = count * 100 + stars * 15 + (adults + kids);
        return { ...d, count, stars, adults, kids, totalHead: adults + kids, people, score };
      });

      const sortedDates = [...dateStats].sort((a, b) => b.score - a.score);
      const topDate = sortedDates[0];

      // 2. Calculate Venues
      const allVenueKeys = [...venues, OTHER_VENUE_KEY];
      const venueStats = allVenueKeys.map(vName => {
        let count = 0;
        let adults = 0;
        let kids = 0;
        const suggestions = [];

        voterList.forEach(v => {
          if (Array.isArray(v.venues) && v.venues.includes(vName)) {
            count++;
            adults += Number(v.adults) || 1;
            kids += Number(v.kids) || 0;
            if (vName === OTHER_VENUE_KEY && v.otherVenue) {
              suggestions.push(`${v.name}: ${v.otherVenue}`);
            }
          }
        });
        return { name: vName, count, adults, kids, totalHead: adults + kids, suggestions };
      }).sort((a, b) => b.count - a.count);

      // 3. Calculate Foods
      const foodStats = FOOD_OPTIONS.map(f => {
        const count = voterList.filter(v => v.food === f.id).length;
        return { ...f, count };
      }).sort((a, b) => b.count - a.count);

      // Render Top Combo Card
      const comboEl = document.getElementById("bestComboCard");
      if (voterList.length === 0) {
        comboEl.innerHTML = `<div class="text-sm text-slate-400 text-center py-2">暫時未有人投票，快啲做第一個！</div>`;
      } else {
        const bestVenue = venueStats[0]?.count > 0 ? venueStats[0].name : "未定";
        const bestFood = foodStats[0]?.count > 0 ? foodStats[0].label : "未定";
        comboEl.innerHTML = `
          <div class="flex items-center justify-between text-xs text-orange-400 font-bold">
            <span>🏆 目前最高票組合</span>
            <span>總投票：${voterList.length} 伙（${totalAdults}大 ${totalKids}細 · 共 ${totalAdults + totalKids} 人）</span>
          </div>
          <div class="text-lg font-extrabold text-white pt-0.5">
            ${topDate.count > 0 ? `${topDate.label} (星期${topDate.dow})` : "未揀日子"} · ${bestVenue}
          </div>
          <div class="text-xs text-slate-300">
            最多人想：${bestFood} ｜ 當日預計出席：<span class="text-emerald-400 font-bold">${topDate.adults}大 ${topDate.kids}細（共 ${topDate.totalHead} 人）</span>
          </div>
        `;
      }

      // Render Dates List (only dates with >=1 vote, or top 6 if empty)
      const activeDates = sortedDates.filter(d => d.count > 0);
      const displayDates = activeDates.length > 0 ? activeDates : DATE_OPTIONS.slice(0, 6).map(d => ({ ...d, count: 0, stars: 0, adults: 0, kids: 0, totalHead: 0, people: [] }));
      const maxDateVotes = Math.max(1, voterList.length);

      document.getElementById("statsDates").innerHTML = displayDates.map(d => {
        const pct = Math.round((d.count / maxDateVotes) * 100);
        const isExpanded = expandedDateId === d.id;
        const peopleTags = d.people.map(p => {
          const icon = p.state === 2 ? "⭐" : "✅";
          const fam = p.kids > 0 ? `${p.adults}大${p.kids}細` : `${p.adults}大`;
          return `<span class="px-2 py-0.5 rounded-md bg-slate-800 border border-slate-700 text-[11px]">${icon} ${escapeHtml(p.name)} (${fam})</span>`;
        }).join("");

        return `
          <div onclick="toggleExpandDate('${d.id}')" class="cursor-pointer rounded-xl bg-slate-900/90 border border-slate-800 p-3 space-y-2">
            <div class="flex items-center justify-between text-sm">
              <div class="font-bold text-white">
                ${d.label} (${d.dow})
                ${d.stars > 0 ? `<span class="text-xs text-amber-400 ml-1">⭐${d.stars}</span>` : ""}
              </div>
              <div class="text-xs text-slate-300">
                <span class="font-bold text-orange-400">${d.count} 伙</span>
                <span class="text-slate-400 ml-1">(${d.adults}大 ${d.kids}細 · 共 ${d.totalHead} 人)</span>
              </div>
            </div>
            <div class="w-full h-2 rounded-full bg-slate-800 overflow-hidden">
              <div class="h-full bg-gradient-to-r from-orange-500 to-amber-400" style="width:${pct}%"></div>
            </div>
            ${(isExpanded && d.people.length > 0) ? `<div class="pt-1 flex flex-wrap gap-1.5">${peopleTags}</div>` : ""}
          </div>
        `;
      }).join("");

      // Render Venues List
      document.getElementById("statsVenues").innerHTML = venueStats.map(v => {
        const pct = voterList.length ? Math.round((v.count / voterList.length) * 100) : 0;
        const suggHtml = v.suggestions.length > 0
          ? `<div class="pt-1 flex flex-wrap gap-1.5">${v.suggestions.map(s => `<span class="px-2 py-0.5 rounded-md bg-orange-500/15 border border-orange-500/30 text-[11px] text-orange-200">💡 ${escapeHtml(s)}</span>`).join("")}</div>`
          : "";
        return `
          <div class="rounded-xl bg-slate-900/90 border border-slate-800 p-3 space-y-1.5">
            <div class="flex items-center justify-between text-sm">
              <span class="font-bold">${escapeHtml(v.name)}</span>
              <span class="text-xs text-slate-300"><b class="text-orange-400">${v.count} 票</b>（共 ${v.totalHead} 人）</span>
            </div>
            <div class="w-full h-2 rounded-full bg-slate-800 overflow-hidden">
              <div class="h-full bg-sky-500" style="width:${pct}%"></div>
            </div>
            ${suggHtml}
          </div>
        `;
      }).join("");

      // Render Food List
      document.getElementById("statsFoods").innerHTML = foodStats.map(f => {
        const pct = voterList.length ? Math.round((f.count / voterList.length) * 100) : 0;
        return `
          <div class="flex items-center justify-between text-xs py-1">
            <span class="w-28 font-semibold text-slate-200">${f.label}</span>
            <div class="flex-1 mx-3 h-2 rounded-full bg-slate-800 overflow-hidden">
              <div class="h-full bg-emerald-500" style="width:${pct}%"></div>
            </div>
            <span class="w-10 text-right font-bold text-slate-300">${f.count} 票</span>
          </div>
        `;
      }).join("");

      // Render Voters List
      if (voterList.length === 0) {
        document.getElementById("statsVoters").innerHTML = `<div class="text-xs text-slate-500">暫無記錄</div>`;
      } else {
        document.getElementById("statsVoters").innerHTML = voterList
          .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))
          .map(v => {
            const foodObj = FOOD_OPTIONS.find(f => f.id === v.food);
            const famText = (v.kids > 0) ? `${v.adults}大 ${v.kids}細` : `${v.adults}大`;
            return `
              <div class="rounded-xl bg-slate-900/80 border border-slate-800 px-3 py-2.5 flex items-center justify-between gap-2">
                <div class="space-y-0.5">
                  <div class="text-sm font-bold text-white flex items-center gap-2">
                    <span>${escapeHtml(v.name)}</span>
                    <span class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-orange-300">${famText}</span>
                    <span class="text-xs text-slate-400">${foodObj ? foodObj.label : ""}</span>
                  </div>
                  ${v.otherVenue ? `<div class="text-xs text-amber-300">📍 建議場地：${escapeHtml(v.otherVenue)}</div>` : ""}
                  ${v.note ? `<div class="text-xs text-slate-400">💬 ${escapeHtml(v.note)}</div>` : ""}
                </div>
                <button onclick="deleteVoter('${v.key.replace(/'/g, "\\'")}')" title="刪除此票" class="text-slate-500 hover:text-rose-400 text-sm px-1.5">✕</button>
              </div>
            `;
          }).join("");
      }
    }

    function toggleExpandDate(id) {
      expandedDateId = (expandedDateId === id) ? null : id;
      updateAllStats();
    }

    async function deleteVoter(voterKey) {
      if (!confirm("確定刪除呢張選票？")) return;
      if (firebaseUrl) {
        await fetch(`${firebaseUrl}/gathering/votes/${encodeURIComponent(voterKey)}.json`, { method: "DELETE" });
        await fetchFirebaseSnapshot();
      } else {
        delete votes[voterKey];
        localStorage.setItem(`${STORAGE_PREFIX}_votes`, JSON.stringify(votes));
        updateAllStats();
      }
      showToast("🗑️ 已刪除選票");
    }

    // =========================================================
    // Tabs, Share & Settings Modal
    // =========================================================
    function switchTab(tab) {
      const isVote = tab === "vote";
      document.getElementById("viewVote").classList.toggle("hidden", !isVote);
      document.getElementById("viewStats").classList.toggle("hidden", isVote);

      document.getElementById("tabBtnVote").className = isVote
        ? "btn-tap py-2.5 rounded-xl font-bold text-sm bg-orange-500 text-white shadow-lg shadow-orange-500/20"
        : "btn-tap py-2.5 rounded-xl font-bold text-sm bg-slate-800 text-slate-300 border border-slate-700";

      document.getElementById("tabBtnStats").className = !isVote
        ? "btn-tap py-2.5 rounded-xl font-bold text-sm bg-orange-500 text-white shadow-lg shadow-orange-500/20"
        : "btn-tap py-2.5 rounded-xl font-bold text-sm bg-slate-800 text-slate-300 border border-slate-700";

      if (!isVote) updateAllStats();
    }

    function buildShareUrl() {
      const base = window.location.origin + window.location.pathname;
      return firebaseUrl ? `${base}?db=${encodeURIComponent(firebaseUrl)}` : base;
    }

    function copyShareLink() {
      const url = buildShareUrl();
      navigator.clipboard.writeText(url).then(() => {
        showToast("🔗 投票 Link 已複製！直接貼落 WhatsApp 即可");
      });
    }

    function copyWhatsAppSummary() {
      const voterList = Object.values(votes);
      if (voterList.length === 0) {
        showToast("暫時未有投票數據");
        return;
      }
      const totalAdults = voterList.reduce((s, v) => s + (Number(v.adults) || 1), 0);
      const totalKids = voterList.reduce((s, v) => s + (Number(v.kids) || 0), 0);

      // Top 3 dates
      const topDates = DATE_OPTIONS.map(d => {
        let count = 0, head = 0;
        voterList.forEach(v => {
          if (v.dates && v.dates[d.id]) {
            count++;
            head += (Number(v.adults) || 1) + (Number(v.kids) || 0);
          }
        });
        return { ...d, count, head };
      }).filter(d => d.count > 0).sort((a, b) => b.count - a.count).slice(0, 3);

      const lines = [
        `🍻 *CityU 兄弟 Gathering 即時戰況*`,
        `已投票：${voterList.length} 伙（${totalAdults}大 ${totalKids}細 · 共 ${totalAdults + totalKids} 人）`,
        ``,
        `📅 *熱門日子 Top 3：*`,
        ...topDates.map((d, i) => `${i + 1}. ${d.label}(${d.dow}) — ${d.count}伙 (共${d.head}人)`),
        ``,
        `🅿️ Louis 會所時租 Car Park 約 $29/hr`,
        `🗳️ 未投快手撳入嚟投：`,
        buildShareUrl()
      ];

      navigator.clipboard.writeText(lines.join("\n")).then(() => {
        showToast("📲 戰況文字已複製！可貼落 WhatsApp Group");
      });
    }

    function openSettings() {
      document.getElementById("inputFirebaseUrl").value = firebaseUrl;
      renderSettingsVenues();
      document.getElementById("settingsModal").classList.remove("hidden");
    }

    function closeSettings() {
      document.getElementById("settingsModal").classList.add("hidden");
    }

    function renderSettingsVenues() {
      const container = document.getElementById("settingsVenueList");
      container.innerHTML = venues.map((v, idx) => `
        <div class="flex items-center justify-between px-3 py-2 rounded-xl bg-slate-900 border border-slate-800 text-xs">
          <span>${escapeHtml(v)}</span>
          <button onclick="removeVenueOption(${idx})" class="text-rose-400 font-bold px-1">刪除</button>
        </div>
      `).join("");
    }

    function addVenueOption() {
      const inp = document.getElementById("inputNewVenue");
      const val = inp.value.trim();
      if (!val || val.toLowerCase() === "others") return;
      if (!venues.includes(val)) {
        venues.push(val);
        inp.value = "";
        renderSettingsVenues();
      }
    }

    function removeVenueOption(idx) {
      if (venues.length <= 1) {
        showToast("至少保留一個預設場地");
        return;
      }
      venues.splice(idx, 1);
      renderSettingsVenues();
    }

    async function saveSettings() {
      const newUrl = cleanFirebaseUrl(document.getElementById("inputFirebaseUrl").value);
      firebaseUrl = newUrl;

      localStorage.setItem(`${STORAGE_PREFIX}_db`, firebaseUrl);
      localStorage.setItem(`${STORAGE_PREFIX}_venues`, JSON.stringify(venues));

      renderVenueOptions();

      if (firebaseUrl) {
        try {
          await fetch(`${firebaseUrl}/gathering/venues.json`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(venues)
          });
          await connectFirebase();
          showToast("🔥 已連通 Firebase 並儲存設定！");
        } catch (e) {
          showToast("⚠️ Firebase 連線失敗，請檢查 URL 同 Test Mode 權限");
        }
      } else {
        loadLocalVotes();
        showToast("✅ 已儲存本地設定");
      }
      closeSettings();
    }

    async function clearAllVotes() {
      if (!confirm("確定要清空晒所有投票紀錄？（清空後即可正式開始投票）")) return;
      if (firebaseUrl) {
        await fetch(`${firebaseUrl}/gathering/votes.json`, { method: "DELETE" });
        await fetchFirebaseSnapshot();
      } else {
        votes = {};
        localStorage.setItem(`${STORAGE_PREFIX}_votes`, JSON.stringify(votes));
        updateAllStats();
      }
      closeSettings();
      showToast("🧹 已清空所有投票！");
    }

    // =========================================================
    // Helpers
    // =========================================================
    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    let toastTimeout = null;
    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.remove("hidden");
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => el.classList.add("hidden"), 2600);
    }

    init();
  </script>
</body>
</html>
